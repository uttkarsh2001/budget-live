<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprint Ledger · Ozi H20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:#06080F; overscroll-behavior:none; }
  ::selection { background:#7C5CFF44; }
  .layout { display:flex; flex-direction:column; gap:14px; padding:20px 16px 120px; max-width:520px; margin:0 auto; }
  .col-pool { margin-top:6px; }
  @media (min-width:1100px) {
    .layout { display:grid; grid-template-columns:330px 1fr 400px; gap:20px; align-items:start;
      max-width:1600px; padding:28px 32px 60px; }
    .col-left { position:sticky; top:24px; }
    .col-pool { margin-top:0; position:sticky; top:24px; max-height:calc(100vh - 48px); overflow-y:auto;
      padding-right:4px; scrollbar-width:thin; scrollbar-color:#1B2336 transparent; }
    .vessel-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  }
  .chip { transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s; cursor:pointer; user-select:none; }
  .chip:active { transform:scale(.94); }
  .chip.lifted { transform:translateY(-6px) scale(1.04) rotate(-1deg); }
  .dropzone { transition:all .2s; cursor:pointer; }
  .dropzone:hover { border-color:#2A3450 !important; }
  .dropzone.armed:active { transform:scale(.985); }
  @keyframes pulseRed { 0%,100%{ box-shadow:0 0 0 0 #FF3B5C33;} 50%{ box-shadow:0 0 16px 2px #FF3B5C55;} }
  @keyframes breathe { 0%,100%{ opacity:.55;} 50%{ opacity:1;} }
  @keyframes slideIn { from{ transform:translateX(40px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
  .cell-done { box-shadow:0 0 8px 1px var(--glow); }
  .arm-hint { animation:breathe 1.6s ease-in-out infinite; }
  .drawer { animation:slideIn .25s cubic-bezier(.22,1,.36,1); }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============ CONFIG ============ */
const DEFAULT_TEAM = [
  { id:"uttkarsh", name:"Uttkarsh", role:"Lead", initials:"UR", color:"#7C5CFF", budget:20, jiraNames:["uttkarsh"] },
  { id:"vishal",   name:"Vishal Roy", role:"Full Stack", initials:"VR", color:"#00E5A0", budget:28, jiraNames:["vishal roy","vishal"] },
  { id:"yash",     name:"Yash Jangir", role:"Flutter", initials:"YJ", color:"#FFB02E", budget:28, jiraNames:["yash jangir"] },
  { id:"intern",   name:"Intern", role:"Support", initials:"IN", color:"#FF5C9D", budget:12, jiraNames:[] },
];
const COLOR_PALETTE = [
  "#7C5CFF","#00E5A0","#FFB02E","#FF5C9D","#3D8BFF","#FF6B35",
  "#A855F7","#06B6D4","#F43F5E","#84CC16","#EC4899","#F59E0B",
];
const DONE_COLOR = "#34F5A4";
const POINT_OPTS = [1,2,3,5,8];
const STATUS_CYCLE = { todo:"doing", doing:"done", done:"todo" };
const WEEKS = 8;
const SNAPSHOT = [
  { key:"H20-1249", summary:"Re-structuring coupon", points:5, type:"Story", jira:null, jiraStatus:"To Do", created:"2026-06-08T10:00:00Z", resolved:null },
  { key:"H20-1248", summary:"[M] Category Coupon Logic handling", points:5, type:"Story", jira:null, jiraStatus:"To Do", created:"2026-06-08T10:00:00Z", resolved:null },
  { key:"H20-1244", summary:"[M] Coupon UI change on cart", points:3, type:"Story", jira:null, jiraStatus:"To Do", created:"2026-06-07T10:00:00Z", resolved:null },
  { key:"H20-1209", summary:"Multiple campaign api calls on app start", points:null, type:"Bug", jira:"uttkarsh.rastogi", jiraStatus:"In Progress", created:"2026-06-02T10:00:00Z", resolved:null },
  { key:"H20-631",  summary:"Shorebird Ph3 Android dev-cycle testing", points:5, type:"Story", jira:"uttkarsh.rastogi", jiraStatus:"Done", created:"2026-05-20T10:00:00Z", resolved:"2026-06-05T10:00:00Z" },
  { key:"H20-1216", summary:"Fix age filter overlap logic", points:1, type:"Story", jira:null, jiraStatus:"To Do", created:"2026-06-05T10:00:00Z", resolved:null },
];

/* ============ HELPERS ============ */
const load = (k,f)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch{ return f; } };
const save = (k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} };
const autoMap = (n,team)=>{ if(!n) return null; const l=n.toLowerCase(); for(const m of team) if(m.jiraNames.some(x=>l.includes(x))) return m.id; return null; };
const mapJiraStatus = s=>{ if(!s) return "todo"; const l=s.toLowerCase();
  if(l.includes("done")||l.includes("closed")||l.includes("resolved")) return "done";
  if(l.includes("progress")||l.includes("review")) return "doing"; return "todo"; };
const chipSize = p=> p>=8?64 : p>=5?56 : p>=3?48 : p>=2?42 : 38;
const fmtDays = d => d==null ? "—" : d<1 ? "<1d" : `${Math.round(d)}d`;

function Num({ value, style }) {
  const ref = useRef(null); const prev = useRef(value);
  useEffect(()=>{ const el=ref.current; if(!el) return;
    const o={v:prev.current};
    gsap.to(o,{ v:value, duration:.6, ease:"power2.out", onUpdate:()=>{ el.textContent=Math.round(o.v); }});
    prev.current=value;
  },[value]);
  return <span ref={ref} style={style}>{value}</span>;
}

function Cells({ budget, planned, done, color }) {
  const n = Math.ceil(budget/2);
  const pc = (planned/budget)*n, dc = (done/budget)*n;
  return (
    <div style={{ display:"flex", gap:3, height:14 }}>
      {Array.from({length:n}).map((_,i)=>{
        const isDone = i < dc - .25;
        const isPlanned = i < pc;
        return <div key={i} className={isDone?"cell-done":""} style={{
          flex:1, borderRadius:3, "--glow":DONE_COLOR+"66",
          background:isDone?DONE_COLOR:isPlanned?color+"55":"#141A28",
          border:`1px solid ${isDone?DONE_COLOR:isPlanned?color+"33":"#1B2336"}`,
          transition:"background .35s, box-shadow .35s", transitionDelay:`${i*25}ms` }}/>;
      })}
    </div>
  );
}

/* Weekly velocity bars */
function Spark({ series, color, height=42 }) {
  const max = Math.max(...series, 1);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:3, height }}>
      {series.map((v,i)=>(
        <div key={i} title={`${v} pts`} style={{ flex:1, borderRadius:"3px 3px 0 0",
          height:`${Math.max((v/max)*100, v>0?12:4)}%`,
          background: i===series.length-1 ? color : color+"55",
          transition:"height .4s", transitionDelay:`${i*40}ms` }}/>
      ))}
    </div>
  );
}

/* Inline info trigger — opens sidebar for that feature */
function InfoTip({ id, activeTip, setActiveTip }) {
  return (
    <span onClick={e=>{ e.stopPropagation(); setActiveTip(activeTip===id?null:id); }}
      style={{ width:18, height:18, borderRadius:6, display:"inline-grid", placeItems:"center",
        fontSize:10, fontWeight:700, cursor:"pointer", marginLeft:6, flexShrink:0,
        background:activeTip===id?"#7C5CFF22":"transparent", color:activeTip===id?"#7C5CFF":"#3A4358",
        border:`1px solid ${activeTip===id?"#7C5CFF44":"#1B2336"}`, transition:"all .15s" }}>?</span>
  );
}

const INFO = {
  budget: {
    title: "Dynamic Sprint Budget",
    desc: "Calculates developer capacity based on their average weekly velocity scaled by the sprint weeks.",
    feature: "Displayed as capacity limits (e.g. /28) on the team cards, dictating the fill cells and overflow red glows.",
    example: "e.g., if a dev has a 58 pt budget for a 2-week sprint, they historically deliver 29 pts/week."
  },
  velocity: {
    title: "Weekly Velocity",
    desc: "Average story points completed per active week over a rolling 8-week history.",
    feature: "Used to automatically compute the capacity limits and visualized in the weekly sparkline chart.",
    example: "e.g., a weekly velocity of 15 means they ship around 15 points of tickets every week."
  },
  cycle: {
    title: "Average Cycle Time",
    desc: "The average calendar days a ticket takes from creation to resolution in Jira.",
    feature: "Displayed as 'Avg Cycle' inside the developer detail drawer stats.",
    example: "e.g., an average cycle time of 4.5d means tickets usually take 4.5 days to complete."
  },
  efficiency: {
    title: "Developer Efficiency",
    desc: "The percentage of planned sprint points successfully completed (Shipped ÷ Planned).",
    feature: "Displayed as 'eff%' badge next to the developer's role and color-coded based on performance thresholds.",
    example: "e.g., if a dev has 10 points planned and ships 8 points, their efficiency is 80%."
  },
  controls: {
    title: "Interactive Controls",
    desc: "Tap a ticket chip, then tap a person to assign. Double-tap to unassign. Tap status indicator to cycle status.",
    feature: "Jira-assigned tickets are locked (🔒) to preserve alignment — reassign those in Jira directly.",
    example: "e.g., tap ticket #1249, then tap Vishal's card to assign it, or double-tap to send it back to the pool."
  }
};

/* ============ APP ============ */
function App() {
  const [issues, setIssues] = useState([]);
  const [src, setSrc] = useState("…");
  const [localAssign, setLocalAssign] = useState(()=>load("budget:assignments",{}));
  const [excluded, setExcluded] = useState(()=>load("budget:excluded",{}));
  const [overridePoints, setOverridePoints] = useState(()=>load("budget:points",{}));
  const [statuses, setStatuses] = useState({});
  const [picked, setPicked] = useState(null);
  const [devDetail, setDevDetail] = useState(null);
  const [loading, setLoading] = useState(true);
  const [title, setTitle] = useState(()=>load("budget:title","Sprint Board"));
  const [sprintWeeks, setSprintWeeks] = useState(()=>load("budget:sprintWeeks", 2));
  const [infoTip, setInfoTip] = useState(null);
  const [selectedEpic, setSelectedEpic] = useState("all");
  const [team, setTeam] = useState(()=>load("budget:team", DEFAULT_TEAM));
  const [teamEditorOpen, setTeamEditorOpen] = useState(false);
  const [editingMember, setEditingMember] = useState(null); // null=list, "new"=add, {member}=edit
  const setTeamSaved = t=>{ setTeam(t); save("budget:team",t); };
  const rootRef = useRef(null);
  const memberRefs = useRef({});
  const chipRefs = useRef({});

  useEffect(()=>{ refresh(); },[]);
  useEffect(()=>{
    if(!loading && rootRef.current){
      gsap.fromTo(rootRef.current.querySelectorAll(".stagger"),
        { y:18, opacity:0 },{ y:0, opacity:1, duration:.5, stagger:.05, ease:"power3.out" });
    }
  },[loading]);

  async function refresh(){
    setLoading(true);
    let data=null;
    try{
      const r = await fetch("/api/issues");
      if(r.ok){ const j=await r.json(); if(j.issues){ data=j.issues; setSrc("live · jira"); } }
    }catch{}
    if(!data){ data=SNAPSHOT; setSrc("snapshot"); }
    setIssues(data);
    /* OPTION A — Jira wins on every refresh: status always re-derived from Jira */
    const st={};
    data.forEach(i=>{ st[i.key]=mapJiraStatus(i.jiraStatus); });
    setStatuses(st);
    setLoading(false);
  }

  /* OPTION A — assignment resolution: Jira assignee always wins; local only fills gaps */
  const memberOf = useCallback(i=>{
    const jiraMember = autoMap(i.jira,team);
    if(jiraMember) return jiraMember;
    return localAssign[i.key] || null;
  },[localAssign,team]);
  const isJiraLocked = i => !!autoMap(i.jira,team);

  const pts = i => overridePoints[i.key] ?? i.points ?? 0;
  const statusOf = k => statuses[k] || "todo";

  const place = useCallback((ticketKey, memberId)=>{
    const chipEl=chipRefs.current[ticketKey], memberEl=memberRefs.current[memberId];
    if(chipEl && memberEl){
      const c=chipEl.getBoundingClientRect(), m=memberEl.getBoundingClientRect();
      const ghost=chipEl.cloneNode(true);
      Object.assign(ghost.style,{ position:"fixed", left:c.left+"px", top:c.top+"px", width:c.width+"px",
        height:c.height+"px", zIndex:999, pointerEvents:"none", margin:0 });
      document.body.appendChild(ghost);
      gsap.to(ghost,{ left:m.left+m.width/2-c.width/2, top:m.top+20, scale:.4, opacity:0,
        duration:.5, ease:"power2.in", onComplete:()=>ghost.remove() });
      gsap.fromTo(memberEl,{scale:1},{scale:1.015,duration:.12,yoyo:true,repeat:1,ease:"power2.out"});
    }
    setLocalAssign(prev=>{ const n={...prev,[ticketKey]:memberId}; save("budget:assignments",n); return n; });
    setPicked(null);
  },[]);

  const unassignLocal = k => setLocalAssign(prev=>{ const n={...prev,[k]:null}; save("budget:assignments",n); return n; });
  const cycleStatus = k => setStatuses(prev=>({ ...prev,[k]:STATUS_CYCLE[statusOf(k)] }));
  const setPts = (k,v)=> setOverridePoints(prev=>{ const n={...prev,[k]:v}; save("budget:points",n); return n; });
  const exclude = k => { setExcluded(prev=>{ const n={...prev,[k]:true}; save("budget:excluded",n); return n; }); setPicked(null); };
  const restoreAll = ()=>{ setExcluded({}); save("budget:excluded",{}); };
  const setTitleSaved = t => { setTitle(t); save("budget:title",t); };

  /* Derive unique epics from loaded issues */
  const epics = useMemo(() => {
    const map = {};
    issues.forEach(i => {
      if (i.epicKey && !map[i.epicKey]) map[i.epicKey] = i.epicTitle || i.epicKey;
    });
    return Object.entries(map).map(([key, label]) => ({ key, label }));
  }, [issues]);

  const active = issues.filter(i => {
    if (excluded[i.key]) return false;
    if (selectedEpic !== "all" && i.epicKey !== selectedEpic) return false;
    return true;
  });
  const pool = active.filter(i=>!memberOf(i));
  const ofMember = id => active.filter(i=>memberOf(i)===id);
  const loadOf = id => ofMember(id).reduce((s,i)=>s+pts(i),0);
  const doneOf = id => ofMember(id).filter(i=>statusOf(i.key)==="done").reduce((s,i)=>s+pts(i),0);
  const totalLoad = team.reduce((s,m)=>s+loadOf(m.id),0);
  const totalDone = team.reduce((s,m)=>s+doneOf(m.id),0);
  const excludedCount = Object.values(excluded).filter(Boolean).length;
  const pickedIssue = picked ? active.find(i=>i.key===picked) : null;

  /* ===== VELOCITY & EFFICIENCY (from Jira resolution dates) ===== */
  const velocity = useMemo(()=>{
    const now = Date.now(), wk = 7*24*3600*1000;
    const buckets = id => {
      const arr = Array(WEEKS).fill(0);
      issues.forEach(i=>{
        if(!i.resolved) return;
        const m = autoMap(i.jira,team);
        if(id!=="team" && m!==id) return;
        const idx = WEEKS-1 - Math.floor((now - new Date(i.resolved).getTime())/wk);
        if(idx>=0 && idx<WEEKS) arr[idx] += (i.points||0);
      });
      return arr;
    };
    const cycleAvg = id => {
      const done = issues.filter(i=>i.resolved && i.created && (id==="team" || autoMap(i.jira,team)===id));
      if(!done.length) return null;
      return done.reduce((s,i)=>s+(new Date(i.resolved)-new Date(i.created))/(24*3600*1000),0)/done.length;
    };
    const out = { team:{ weeks:buckets("team"), cycle:cycleAvg("team") } };
    team.forEach(m=>{ out[m.id] = { weeks:buckets(m.id), cycle:cycleAvg(m.id) }; });
    return out;
  },[issues,team]);

  const weeklyAvg = w => { const nz=w.filter(x=>x>0); return nz.length? Math.round(w.reduce((a,b)=>a+b,0)/Math.max(nz.length,1)) : 0; };
  const efficiency = id => { const l=loadOf(id); return l? Math.round((doneOf(id)/l)*100) : null; };

  const budgetOf = useCallback(id => {
    const m = team.find(x => x.id === id);
    const v = velocity[id];
    const avg = v ? weeklyAvg(v.weeks) : 0;
    const computed = avg * sprintWeeks;
    return computed > 0 ? computed : (m ? m.budget : 15);
  }, [velocity, sprintWeeks, team]);

  const totalBudget = team.reduce((s,m)=>s+budgetOf(m.id),0);

  const R=52, C=2*Math.PI*R;
  const arcPlanned=Math.min(totalLoad/totalBudget,1)*C*.75;
  const arcDone=Math.min(totalDone/totalBudget,1)*C*.75;

  if(loading) return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", fontFamily:"'Space Grotesk'" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontSize:11, letterSpacing:".3em", color:"#7C5CFF", textTransform:"uppercase", marginBottom:10 }}>Sprint Ledger</div>
        <div style={{ width:34, height:34, border:"3px solid #141A28", borderTopColor:"#7C5CFF", borderRadius:"50%", margin:"0 auto", animation:"spin .7s linear infinite" }}/>
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    </div>
  );

  const detailMember = devDetail ? team.find(m=>m.id===devDetail) : null;

  return (
    <div ref={rootRef} style={{ fontFamily:"'Space Grotesk',-apple-system,sans-serif", color:"#E6EAF3", minHeight:"100vh",
      background:"radial-gradient(1200px 600px at 50% -10%, #10142455, transparent), #06080F" }}>
    <div className="layout">

      {/* ============ LEFT RAIL ============ */}
      <div className="col-left">
        <div className="stagger" style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:12 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:10, letterSpacing:".32em", color:"#7C5CFF", textTransform:"uppercase", fontWeight:600 }}>Sprint Ledger</div>
            <input value={title} onChange={e=>setTitleSaved(e.target.value)}
              style={{ fontSize:24, fontWeight:700, letterSpacing:"-.02em", marginTop:2, background:"transparent",
                border:"none", outline:"none", color:"#E6EAF3", fontFamily:"inherit", width:"100%", padding:0 }}/>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:4 }}>
              <span style={{ fontSize:10, color:"#4A5468", fontFamily:"'JetBrains Mono'" }}>Sprint:</span>
              <select value={sprintWeeks} onChange={e=>{ const w=parseInt(e.target.value); setSprintWeeks(w); save("budget:sprintWeeks", w); }}
                style={{ background:"#0D111C", border:"1px solid #1B2336", borderRadius:6, color:"#8B93A7", fontSize:10,
                  fontFamily:"'JetBrains Mono'", padding:"2px 6px", outline:"none", cursor:"pointer" }}>
                <option value={1}>1 Week</option>
                <option value={2}>2 Weeks</option>
                <option value={3}>3 Weeks</option>
                <option value={4}>4 Weeks</option>
              </select>
              <span style={{ fontSize:10, color:"#3A4358", fontFamily:"'JetBrains Mono'" }}>· {src}</span>
            </div>
          </div>
          <div style={{ display:"flex", gap:6 }}>
            <button onClick={()=>{ setTeamEditorOpen(true); setEditingMember(null); }} aria-label="Team" style={{ width:38, height:38, borderRadius:11, border:"1px solid #1B2336",
              background:"#0D111C", color:"#8B93A7", fontSize:15, cursor:"pointer", flexShrink:0 }}>⚙</button>
            <button onClick={refresh} aria-label="Refresh" style={{ width:38, height:38, borderRadius:11, border:"1px solid #1B2336",
              background:"#0D111C", color:"#8B93A7", fontSize:15, cursor:"pointer", flexShrink:0 }}>↻</button>
          </div>
        </div>

        {/* Epic filter dropdown */}
        {epics.length > 0 && (
          <div className="stagger" style={{ marginBottom:12 }}>
            <div style={{ position:"relative" }}>
              <select value={selectedEpic} onChange={e=>setSelectedEpic(e.target.value)}
                style={{ width:"100%", background:"#0D111C", border:`1px solid ${selectedEpic==="all"?"#1B2336":"#7C5CFF55"}`,
                  borderRadius:11, color:selectedEpic==="all"?"#6B7488":"#7C5CFF",
                  fontSize:11, fontWeight:600, fontFamily:"'JetBrains Mono'",
                  padding:"9px 32px 9px 12px", outline:"none", cursor:"pointer",
                  appearance:"none", letterSpacing:".04em",
                  transition:"border-color .15s, color .15s" }}>
                <option value="all">All Epics</option>
                {epics.map(e => (
                  <option key={e.key} value={e.key}>{e.label}</option>
                ))}
              </select>
              <svg style={{ position:"absolute", right:10, top:"50%", transform:"translateY(-50%)", pointerEvents:"none" }}
                width="10" height="6" viewBox="0 0 10 6" fill="none">
                <path d="M1 1l4 4 4-4" stroke={selectedEpic==="all"?"#3A4358":"#7C5CFF"} strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </div>
          </div>
        )}

        {/* Dial */}
        <div className="stagger" style={{ display:"flex", alignItems:"center", gap:16, background:"#0D111C",
          border:"1px solid #161D2E", borderRadius:20, padding:"14px 16px", marginBottom:12 }}>
          <svg width="112" height="112" viewBox="0 0 120 120">
            <g transform="rotate(135 60 60)">
              <circle cx="60" cy="60" r={R} fill="none" stroke="#141A28" strokeWidth="9" strokeDasharray={`${C*.75} ${C}`} strokeLinecap="round"/>
              <circle cx="60" cy="60" r={R} fill="none" stroke="#7C5CFF55" strokeWidth="9" strokeDasharray={`${arcPlanned} ${C}`} strokeLinecap="round"/>
              <circle cx="60" cy="60" r={R} fill="none" stroke={DONE_COLOR} strokeWidth="9" strokeDasharray={`${arcDone} ${C}`} strokeLinecap="round"
                style={{ filter:`drop-shadow(0 0 6px ${DONE_COLOR}66)`, transition:"stroke-dasharray .6s" }}/>
            </g>
            <text x="60" y="56" textAnchor="middle" fill="#E6EAF3" fontSize="24" fontWeight="700" fontFamily="Space Grotesk"><Num value={totalDone}/></text>
            <text x="60" y="74" textAnchor="middle" fill="#3A4358" fontSize="10" fontFamily="JetBrains Mono">of {totalLoad} pts</text>
          </svg>
          <div style={{ flex:1 }}>
            {[["Done",totalDone,DONE_COLOR],["Planned",totalLoad,"#7C5CFF"],["Capacity",totalBudget,"#3A4358"]].map(([l,v,c])=>(
              <div key={l} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0",
                borderBottom:l!=="Capacity"?"1px solid #11182A":"none" }}>
                <span style={{ fontSize:11, color:"#6B7488", display:"flex", alignItems:"center", gap:6 }}>
                  <span style={{ width:7, height:7, borderRadius:2, background:c }}/>{l}
                  {l==="Capacity" && <InfoTip id="budget" activeTip={infoTip} setActiveTip={setInfoTip}/>}
                </span>
                <Num value={v} style={{ fontSize:15, fontWeight:700, color:l==="Capacity"?"#6B7488":"#E6EAF3", fontFamily:"'JetBrains Mono'" }}/>
              </div>
            ))}
          </div>
        </div>

        {/* Team velocity */}
        <div className="stagger" style={{ background:"#0D111C", border:"1px solid #161D2E", borderRadius:20, padding:"14px 16px", marginBottom:12 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:10 }}>
            <span style={{ fontSize:10, letterSpacing:".24em", color:"#4A5468", textTransform:"uppercase", fontWeight:600, display:"flex", alignItems:"center" }}>Team Velocity<InfoTip id="velocity" activeTip={infoTip} setActiveTip={setInfoTip}/></span>
            <span style={{ fontFamily:"'JetBrains Mono'", fontSize:11, color:"#6B7488" }}>
              ~<span style={{ color:DONE_COLOR, fontWeight:700 }}>{weeklyAvg(velocity.team.weeks)}</span> pts/wk
            </span>
          </div>
          <Spark series={velocity.team.weeks} color={DONE_COLOR}/>
          <div style={{ display:"flex", justifyContent:"space-between", marginTop:6, fontSize:9, color:"#3A4358", fontFamily:"'JetBrains Mono'" }}>
            <span>{WEEKS}w ago</span><span>avg cycle {fmtDays(velocity.team.cycle)}</span><span>now</span>
          </div>
        </div>

        <div className="stagger" style={{ fontSize:9, color:"#252D40", fontFamily:"'JetBrains Mono'", letterSpacing:".08em", lineHeight:2, display:"flex", alignItems:"center", flexWrap:"wrap" }}>
          <span>TAP CHIP → TAP PERSON · TAP DEV CARD = DETAILS · JIRA LOCKS 🔒</span>
          <InfoTip id="controls" activeTip={infoTip} setActiveTip={setInfoTip}/>
        </div>
      </div>

      {/* ============ VESSELS ============ */}
      <div>
        {pickedIssue && (
          <div className="arm-hint" style={{ position:"sticky", top:8, zIndex:50, background:"#7C5CFF",
            borderRadius:14, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:10,
            boxShadow:"0 8px 28px #7C5CFF44" }}>
            <span style={{ fontFamily:"'JetBrains Mono'", fontSize:11, fontWeight:700, color:"#0A0618" }}>{pickedIssue.key}</span>
            <span style={{ flex:1, fontSize:12, color:"#1A1033", fontWeight:600 }}>→ tap a person</span>
            <button onClick={()=>setPicked(null)} style={{ border:"none", background:"#0A061833", color:"#0A0618",
              borderRadius:8, padding:"4px 10px", fontSize:11, fontWeight:700, cursor:"pointer" }}>cancel</button>
          </div>
        )}

        <div className="vessel-grid">
        {team.map(m=>{
          const b=budgetOf(m.id), l=loadOf(m.id), d=doneOf(m.id), over=l>b;
          const mine=ofMember(m.id);
          const armed=!!picked;
          const eff=efficiency(m.id);
          return (
            <div key={m.id} ref={el=>memberRefs.current[m.id]=el}
              className={`stagger dropzone ${armed?"armed":""}`}
              onClick={armed ? ()=>place(picked,m.id) : ()=>setDevDetail(m.id)}
              style={{ background:"#0D111C", borderRadius:18, padding:14, marginBottom:10,
                border:armed?`1.5px dashed ${m.color}`:over?"1px solid #FF3B5C44":"1px solid #161D2E",
                animation:over?"pulseRed 2s infinite":"none",
                boxShadow:armed?`0 0 24px ${m.color}22`:"none" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:9 }}>
                <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                  <div style={{ width:32, height:32, borderRadius:10, background:`linear-gradient(135deg, ${m.color}33, ${m.color}11)`,
                    border:`1px solid ${m.color}44`, display:"grid", placeItems:"center", fontSize:11, fontWeight:700, color:m.color }}>{m.initials}</div>
                  <div>
                    <div style={{ fontSize:14, fontWeight:700 }}>{m.name}</div>
                    <div style={{ fontSize:10, color:"#4A5468" }}>{m.role}{eff!=null && <span style={{ color:eff>=70?DONE_COLOR:eff>=40?"#FFB02E":"#FF3B5C" }}> · {eff}% eff</span>}</div>
                  </div>
                </div>
                <div style={{ textAlign:"right", fontFamily:"'JetBrains Mono'" }}>
                  <div style={{ fontSize:16, fontWeight:700 }}>
                    <span style={{ color:DONE_COLOR }}><Num value={d}/></span>
                    <span style={{ color:over?"#FF3B5C":m.color }}>/<Num value={l}/></span>
                    <span style={{ fontSize:11, color:"#3A4358" }}>/{b}</span>
                  </div>
                  {over && <div style={{ fontSize:9, color:"#FF3B5C", fontWeight:700 }}>+{l-b} OVER</div>}
                </div>
              </div>
              <Cells budget={b} planned={l} done={d} color={m.color}/>
              {mine.length>0 && (
                <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:10 }}>
                  {mine.map(i=>{
                    const st=statusOf(i.key), isDone=st==="done", isDoing=st==="doing", locked=isJiraLocked(i);
                    return (
                      <div key={i.key} onClick={e=>{ e.stopPropagation(); cycleStatus(i.key); }}
                        onDoubleClick={e=>{ e.stopPropagation(); if(!locked) unassignLocal(i.key); }}
                        title={`${i.summary}${locked?" · assigned in Jira (reassign there)":" · double-tap: back to pool"}`}
                        style={{ display:"flex", alignItems:"center", gap:6, padding:"6px 9px", borderRadius:9, cursor:"pointer",
                          background:isDone?DONE_COLOR+"14":"#0A0E18",
                          border:`1px solid ${isDone?DONE_COLOR+"55":isDoing?"#3D8BFF66":"#1B2336"}`, opacity:isDone?.75:1 }}>
                        <span style={{ width:6, height:6, borderRadius:"50%",
                          background:isDone?DONE_COLOR:isDoing?"#3D8BFF":"#4A5468",
                          boxShadow:isDone?`0 0 6px ${DONE_COLOR}`:"none" }}/>
                        <span style={{ fontFamily:"'JetBrains Mono'", fontSize:10, fontWeight:700,
                          color:isDone?DONE_COLOR:"#8B93A7", textDecoration:isDone?"line-through":"none" }}>{i.key.replace("H20-","#")}</span>
                        <span style={{ fontSize:10, fontWeight:700, fontFamily:"'JetBrains Mono'", color:isDone?DONE_COLOR:m.color }}>{pts(i)||"?"}</span>
                        {locked && <span style={{ fontSize:8, opacity:.5 }}>🔒</span>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        </div>
      </div>

      {/* ============ POOL ============ */}
      <div className="col-pool">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:10 }}>
          <div style={{ fontSize:11, letterSpacing:".24em", color:"#4A5468", textTransform:"uppercase", fontWeight:600 }}>The Pool · {pool.length}</div>
          <div style={{ fontSize:10, color:"#3A4358" }}>unassigned in jira</div>
        </div>
        {pool.length===0 ? (
          <div style={{ textAlign:"center", padding:"28px 0", color:"#3A4358", fontSize:13, border:"1px dashed #1B2336", borderRadius:16 }}>
            Pool's empty — sprint is fully dealt ✦
          </div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
            {pool.map(i=>{
              const p=pts(i), s=chipSize(p||1), isPicked=picked===i.key;
              return (
                <div key={i.key} ref={el=>chipRefs.current[i.key]=el}
                  className={`chip ${isPicked?"lifted":""}`}
                  onClick={()=>setPicked(isPicked?null:i.key)}
                  style={{ background:isPicked?"linear-gradient(135deg,#171231,#0D111C)":"#0D111C",
                    border:isPicked?"1.5px solid #7C5CFF":i.type==="Bug"?"1px solid #FF3B5C33":"1px solid #1B2336",
                    borderRadius:14, padding:"10px 12px",
                    boxShadow:isPicked?"0 12px 32px #7C5CFF33":"0 2px 8px #00000040",
                    display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ width:s*.62, height:s*.62, minWidth:s*.62, borderRadius:"50%",
                    background:p?"radial-gradient(circle at 32% 30%, #232B44, #11182A)":"#1A1020",
                    border:p?"1px solid #2A3450":"1px dashed #FFB02E66",
                    display:"grid", placeItems:"center", fontFamily:"'JetBrains Mono'", fontWeight:700,
                    fontSize:p>=8?17:p>=5?15:13, color:p?"#E6EAF3":"#FFB02E" }}>{p||"?"}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                      <span style={{ fontFamily:"'JetBrains Mono'", fontSize:10, fontWeight:700, color:"#7C5CFF" }}>{i.key}</span>
                      {i.type==="Bug" && <span style={{ fontSize:8, fontWeight:700, color:"#FF3B5C", letterSpacing:".1em" }}>BUG</span>}
                    </div>
                    <div style={{ fontSize:11.5, color:"#8B93A7", lineHeight:1.3, marginTop:2,
                      overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical" }}>{i.summary}</div>
                    {!p && isPicked && (
                      <div style={{ display:"flex", gap:4, marginTop:7 }} onClick={e=>e.stopPropagation()}>
                        {POINT_OPTS.map(o=>(
                          <button key={o} onClick={()=>setPts(i.key,o)} style={{ padding:"3px 9px", borderRadius:6, border:"none",
                            cursor:"pointer", fontFamily:"'JetBrains Mono'", fontSize:10, fontWeight:700,
                            background:"#1B2336", color:"#8B93A7" }}>{o}</button>
                        ))}
                      </div>
                    )}
                  </div>
                  {isPicked && (
                    <button onClick={e=>{ e.stopPropagation(); exclude(i.key); }} title="Not this sprint"
                      style={{ border:"none", background:"#1B2336", color:"#4A5468", borderRadius:8, width:26, height:26, cursor:"pointer", fontSize:12 }}>✕</button>
                  )}
                </div>
              );
            })}
          </div>
        )}
        {excludedCount>0 && (
          <div style={{ marginTop:12, fontSize:11, color:"#3A4358", textAlign:"center" }}>
            {excludedCount} parked ·{" "}
            <span onClick={restoreAll} style={{ color:"#7C5CFF", cursor:"pointer", textDecoration:"underline" }}>bring back</span>
          </div>
        )}
      </div>
    </div>

    {/* ============ DEV DETAIL DRAWER ============ */}
    {detailMember && (()=>{
      const m=detailMember, mine=ofMember(m.id);
      const l=loadOf(m.id), d=doneOf(m.id), eff=efficiency(m.id);
      const v=velocity[m.id];
      const b=budgetOf(m.id);
      const groups=[["doing","In Flight","#3D8BFF"],["todo","Queued","#6B7488"],["done","Shipped",DONE_COLOR]];
      const avgSize = mine.length? (l/mine.length).toFixed(1) : "—";
      return (
        <div onClick={()=>setDevDetail(null)} style={{ position:"fixed", inset:0, background:"#06080FCC",
          backdropFilter:"blur(4px)", zIndex:100, display:"flex", justifyContent:"flex-end" }}>
          <div className="drawer" onClick={e=>e.stopPropagation()} style={{ width:"min(440px, 100vw)", height:"100vh",
            overflowY:"auto", background:"#0A0E18", borderLeft:`1px solid ${m.color}33`, padding:"24px 22px" }}>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ width:44, height:44, borderRadius:14, background:`linear-gradient(135deg, ${m.color}33, ${m.color}11)`,
                  border:`1px solid ${m.color}55`, display:"grid", placeItems:"center", fontSize:14, fontWeight:700, color:m.color }}>{m.initials}</div>
                <div>
                  <div style={{ fontSize:19, fontWeight:700 }}>{m.name}</div>
                  <div style={{ fontSize:11, color:"#4A5468" }}>{m.role} · {b} pt budget</div>
                </div>
              </div>
              <button onClick={()=>setDevDetail(null)} style={{ width:34, height:34, borderRadius:10, border:"1px solid #1B2336",
                background:"#0D111C", color:"#6B7488", cursor:"pointer", fontSize:14 }}>✕</button>
            </div>

            {/* Stat grid */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14 }}>
              {[
                ["Efficiency", eff!=null?eff+"%":"—", eff!=null?(eff>=70?DONE_COLOR:eff>=40?"#FFB02E":"#FF3B5C"):"#4A5468", "done ÷ planned", "efficiency"],
                ["Velocity", weeklyAvg(v.weeks)+" pts/wk", m.color, "avg active week", "velocity"],
                ["Avg Cycle", fmtDays(v.cycle), "#3D8BFF", "created → resolved", "cycle"],
                ["Avg Ticket", avgSize+" pts", "#8B93A7", `${mine.length} tickets`, null],
              ].map(([label,val,color,sub,tipId])=>(
                <div key={label} style={{ background:"#0D111C", border:"1px solid #161D2E", borderRadius:14, padding:"12px 13px" }}>
                  <div style={{ fontSize:9, letterSpacing:".18em", color:"#4A5468", textTransform:"uppercase", marginBottom:5, display:"flex", alignItems:"center" }}>
                    {label}{tipId && <InfoTip id={tipId} activeTip={infoTip} setActiveTip={setInfoTip}/>}
                  </div>
                  <div style={{ fontSize:19, fontWeight:700, color, fontFamily:"'JetBrains Mono'" }}>{val}</div>
                  <div style={{ fontSize:9, color:"#3A4358", marginTop:2 }}>{sub}</div>
                </div>
              ))}
            </div>

            {/* Velocity trend */}
            <div style={{ background:"#0D111C", border:"1px solid #161D2E", borderRadius:14, padding:"12px 13px", marginBottom:14 }}>
              <div style={{ fontSize:9, letterSpacing:".18em", color:"#4A5468", textTransform:"uppercase", marginBottom:8 }}>Shipped pts · last {WEEKS} weeks</div>
              <Spark series={v.weeks} color={m.color} height={56}/>
            </div>

            {/* Capacity */}
            <div style={{ background:"#0D111C", border:"1px solid #161D2E", borderRadius:14, padding:"12px 13px", marginBottom:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                <span style={{ fontSize:9, letterSpacing:".18em", color:"#4A5468", textTransform:"uppercase" }}>This Sprint</span>
                <span style={{ fontFamily:"'JetBrains Mono'", fontSize:12, fontWeight:700 }}>
                  <span style={{ color:DONE_COLOR }}>{d}</span><span style={{ color:m.color }}>/{l}</span><span style={{ color:"#3A4358" }}>/{b}</span>
                </span>
              </div>
              <Cells budget={b} planned={l} done={d} color={m.color}/>
            </div>

            {/* Tickets by status */}
            {groups.map(([st,label,color])=>{
              const list=mine.filter(i=>statusOf(i.key)===st);
              if(!list.length) return null;
              return (
                <div key={st} style={{ marginBottom:14 }}>
                  <div style={{ fontSize:9, letterSpacing:".18em", color, textTransform:"uppercase", fontWeight:700, marginBottom:6 }}>
                    {label} · {list.length} · {list.reduce((s,i)=>s+pts(i),0)} pts
                  </div>
                  {list.map(i=>(
                    <div key={i.key} onClick={()=>cycleStatus(i.key)} style={{ display:"flex", alignItems:"center", gap:8,
                      padding:"8px 10px", background:"#0D111C", border:`1px solid ${color}22`, borderRadius:10, marginBottom:5, cursor:"pointer" }}>
                      <span style={{ fontFamily:"'JetBrains Mono'", fontSize:10, fontWeight:700, color:"#7C5CFF", minWidth:64 }}>{i.key}</span>
                      <span style={{ flex:1, fontSize:11.5, color:st==="done"?"#4A5468":"#A8B0C2",
                        textDecoration:st==="done"?"line-through":"none", lineHeight:1.3 }}>{i.summary}</span>
                      <span style={{ fontFamily:"'JetBrains Mono'", fontSize:11, fontWeight:700, color }}>{pts(i)||"?"}</span>
                      {isJiraLocked(i) && <span style={{ fontSize:9, opacity:.4 }}>🔒</span>}
                    </div>
                  ))}
                </div>
              );
            })}
            {mine.length===0 && <div style={{ textAlign:"center", color:"#3A4358", fontSize:12, padding:"20px 0" }}>No tickets this sprint</div>}
          </div>
        </div>
      );
    })()}

    {/* ============ INFO SIDEBAR ============ */}
    {infoTip && INFO[infoTip] && (
      <div onClick={()=>setInfoTip(null)} style={{ position:"fixed", inset:0, background:"#06080FCC",
        backdropFilter:"blur(4px)", zIndex:100, display:"flex", justifyContent:"flex-end" }}>
        <div className="drawer" onClick={e=>e.stopPropagation()} style={{ width:"min(380px, 100vw)", height:"100vh",
          overflowY:"auto", background:"#0A0E18", borderLeft:"1px solid #7C5CFF33", padding:"24px 22px" }}>

          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:24 }}>
            <div>
              <div style={{ fontSize:10, letterSpacing:".32em", color:"#7C5CFF", textTransform:"uppercase", fontWeight:600 }}>Sprint Ledger</div>
              <div style={{ fontSize:19, fontWeight:700, marginTop:2 }}>{INFO[infoTip].title}</div>
            </div>
            <button onClick={()=>setInfoTip(null)} style={{ width:34, height:34, borderRadius:10, border:"1px solid #1B2336",
              background:"#0D111C", color:"#6B7488", cursor:"pointer", fontSize:14 }}>✕</button>
          </div>

          <div style={{ background:"#0D111C", border:"1px solid #161D2E", borderRadius:14, padding:"16px" }}>
            <div style={{ fontSize:11.5, color:"#E6EAF3", lineHeight:1.5, marginBottom:10 }}>{INFO[infoTip].desc}</div>
            <div style={{ fontSize:11, color:"#8B93A7", lineHeight:1.4, marginBottom:8 }}>
              <strong style={{ color:"#4A5468" }}>UI Feature: </strong>{INFO[infoTip].feature}
            </div>
            <div style={{ fontSize:11, color:"#00E5A0", fontStyle:"italic", fontFamily:"'JetBrains Mono'", lineHeight:1.4 }}>
              {INFO[infoTip].example}
            </div>
          </div>
        </div>
      </div>
    )}
    {/* ============ TEAM EDITOR DRAWER ============ */}
    {teamEditorOpen && (
      <div onClick={()=>{ setTeamEditorOpen(false); setEditingMember(null); }} style={{ position:"fixed", inset:0, background:"#06080FCC",
        backdropFilter:"blur(4px)", zIndex:100, display:"flex", justifyContent:"flex-end" }}>
        <div className="drawer" onClick={e=>e.stopPropagation()} style={{ width:"min(420px, 100vw)", height:"100vh",
          overflowY:"auto", background:"#0A0E18", borderLeft:"1px solid #7C5CFF33", padding:"24px 22px" }}>

          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
            <div>
              <div style={{ fontSize:10, letterSpacing:".32em", color:"#7C5CFF", textTransform:"uppercase", fontWeight:600 }}>Sprint Ledger</div>
              <div style={{ fontSize:19, fontWeight:700, marginTop:2 }}>{editingMember ? (editingMember==="new"?"Add Member":"Edit Member") : "Team"}</div>
            </div>
            <button onClick={()=>{ if(editingMember){ setEditingMember(null); } else { setTeamEditorOpen(false); } }}
              style={{ width:34, height:34, borderRadius:10, border:"1px solid #1B2336",
              background:"#0D111C", color:"#6B7488", cursor:"pointer", fontSize:14 }}>{editingMember?"←":"✕"}</button>
          </div>

          {!editingMember ? (
            /* ---- Member list ---- */
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {team.map(m=>(
                <div key={m.id} style={{ background:"#0D111C", border:"1px solid #161D2E", borderRadius:14, padding:"12px 14px",
                  display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ width:34, height:34, borderRadius:10, background:`linear-gradient(135deg, ${m.color}33, ${m.color}11)`,
                    border:`1px solid ${m.color}44`, display:"grid", placeItems:"center", fontSize:11, fontWeight:700, color:m.color, flexShrink:0 }}>{m.initials}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:700 }}>{m.name}</div>
                    <div style={{ fontSize:10, color:"#4A5468" }}>{m.role} · {m.budget} pts · {m.jiraNames.length? m.jiraNames.join(", ") : "no jira link"}</div>
                  </div>
                  <button onClick={()=>setEditingMember({...m})} style={{ width:28, height:28, borderRadius:8, border:"1px solid #1B2336",
                    background:"transparent", color:"#6B7488", cursor:"pointer", fontSize:12 }}>✎</button>
                  <button onClick={()=>{
                    if(!confirm(`Remove ${m.name}? Their local assignments will go back to the pool.`)) return;
                    const next = team.filter(x=>x.id!==m.id);
                    setTeamSaved(next);
                    setLocalAssign(prev=>{ const n={...prev}; Object.keys(n).forEach(k=>{ if(n[k]===m.id) n[k]=null; }); save("budget:assignments",n); return n; });
                  }} style={{ width:28, height:28, borderRadius:8, border:"1px solid #1B2336",
                    background:"transparent", color:"#FF3B5C88", cursor:"pointer", fontSize:12 }}>✕</button>
                </div>
              ))}

              {/* Add member button */}
              <div onClick={()=>setEditingMember("new")} style={{ border:"1px dashed #1B2336", borderRadius:14, padding:"14px",
                textAlign:"center", cursor:"pointer", color:"#4A5468", fontSize:12, fontWeight:600 }}>
                + Add Member
              </div>

              {/* Reset to defaults */}
              <div style={{ marginTop:8, fontSize:11, color:"#3A4358", textAlign:"center" }}>
                <span onClick={()=>{ if(!confirm("Reset team to defaults? This will remove custom members.")) return; setTeamSaved(DEFAULT_TEAM); }}
                  style={{ color:"#7C5CFF", cursor:"pointer", textDecoration:"underline" }}>Reset to Default Team</span>
              </div>
            </div>
          ) : (
            /* ---- Add / Edit form ---- */
            <MemberForm
              initial={editingMember==="new" ? null : editingMember}
              team={team}
              onSave={member=>{
                if(editingMember==="new"){
                  setTeamSaved([...team, member]);
                } else {
                  setTeamSaved(team.map(m=>m.id===member.id ? member : m));
                }
                setEditingMember(null);
              }}
              onCancel={()=>setEditingMember(null)}
            />
          )}
        </div>
      </div>
    )}
    </div>
  );
}

/* ============ MEMBER FORM ============ */
function MemberForm({ initial, team, onSave, onCancel }) {
  const deriveInitials = name => {
    const parts = name.trim().split(/\s+/);
    if(parts.length>=2) return (parts[0][0]+parts[1][0]).toUpperCase();
    return name.slice(0,2).toUpperCase();
  };
  const deriveId = name => {
    const base = name.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
    let id = base;
    let i = 2;
    while(team.some(m=>m.id===id)) { id = base+"-"+i; i++; }
    return id;
  };
  const usedColors = team.filter(m=>!initial||m.id!==initial?.id).map(m=>m.color);
  const autoColor = COLOR_PALETTE.find(c=>!usedColors.includes(c)) || COLOR_PALETTE[0];

  const [name, setName] = useState(initial?.name || "");
  const [role, setRole] = useState(initial?.role || "");
  const [initials, setInitials] = useState(initial?.initials || "");
  const [color, setColor] = useState(initial?.color || autoColor);
  const [budget, setBudget] = useState(initial?.budget ?? 20);
  const [jiraNames, setJiraNames] = useState(initial?.jiraNames || []);
  const [jiraInput, setJiraInput] = useState("");
  const [autoInitials, setAutoInitials] = useState(!initial);

  const handleNameChange = v => {
    setName(v);
    if(autoInitials && v.trim()) setInitials(deriveInitials(v));
  };

  const handleSave = () => {
    if(!name.trim()) return;
    onSave({
      id: initial?.id || deriveId(name),
      name: name.trim(),
      role: role.trim() || "Member",
      initials: initials || deriveInitials(name),
      color,
      budget: Math.max(1, parseInt(budget)||20),
      jiraNames,
    });
  };

  const inputStyle = { width:"100%", background:"#0D111C", border:"1px solid #1B2336", borderRadius:10,
    color:"#E6EAF3", fontFamily:"inherit", padding:"10px 12px", fontSize:12, outline:"none" };
  const labelStyle = { fontSize:9, letterSpacing:".18em", color:"#4A5468", textTransform:"uppercase", fontWeight:600, marginBottom:6, display:"block" };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
      {/* Name */}
      <div>
        <label style={labelStyle}>Name</label>
        <input value={name} onChange={e=>handleNameChange(e.target.value)} placeholder="e.g. Alex Smith" style={inputStyle}/>
      </div>

      {/* Role */}
      <div>
        <label style={labelStyle}>Role</label>
        <input value={role} onChange={e=>setRole(e.target.value)} placeholder="e.g. Full Stack, Flutter" style={inputStyle}/>
      </div>

      {/* Initials + Budget row */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <div>
          <label style={labelStyle}>Initials</label>
          <input value={initials} onChange={e=>{ setInitials(e.target.value.toUpperCase().slice(0,2)); setAutoInitials(false); }}
            maxLength={2} style={{...inputStyle, textAlign:"center", letterSpacing:".1em", fontWeight:700}}/>
        </div>
        <div>
          <label style={labelStyle}>Budget (pts)</label>
          <input type="number" value={budget} onChange={e=>setBudget(e.target.value)} min={1} style={{...inputStyle, fontFamily:"'JetBrains Mono'"}}/>
        </div>
      </div>

      {/* Color */}
      <div>
        <label style={labelStyle}>Color</label>
        <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
          {COLOR_PALETTE.map(c=>(
            <div key={c} onClick={()=>setColor(c)} style={{ width:28, height:28, borderRadius:"50%", background:c, cursor:"pointer",
              boxShadow:color===c?"0 0 0 2.5px #E6EAF3":"none", opacity:usedColors.includes(c)?.5:1,
              transition:"box-shadow .15s, opacity .15s" }}/>
          ))}
        </div>
      </div>

      {/* Jira Names */}
      <div>
        <label style={labelStyle}>Jira Display Names</label>
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:jiraNames.length?8:0 }}>
          {jiraNames.map((n,i)=>(
            <span key={i} style={{ display:"flex", alignItems:"center", gap:4, background:"#161D2E", borderRadius:8,
              padding:"4px 8px", fontSize:11, color:"#8B93A7", fontFamily:"'JetBrains Mono'" }}>
              {n}
              <span onClick={()=>setJiraNames(jiraNames.filter((_,j)=>j!==i))} style={{ cursor:"pointer", color:"#FF3B5C88", fontWeight:700, fontSize:13 }}>×</span>
            </span>
          ))}
        </div>
        <div style={{ display:"flex", gap:6 }}>
          <input value={jiraInput} onChange={e=>setJiraInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter" && jiraInput.trim()){ setJiraNames([...jiraNames, jiraInput.trim().toLowerCase()]); setJiraInput(""); e.preventDefault(); }}}
            placeholder="Type name + Enter" style={{...inputStyle, flex:1}}/>
        </div>
        <div style={{ fontSize:9, color:"#3A4358", marginTop:4 }}>Matches Jira assignee display names (substring, case-insensitive)</div>
      </div>

      {/* Preview */}
      {name.trim() && (
        <div style={{ background:"#0D111C", border:"1px solid #161D2E", borderRadius:14, padding:"12px 14px", display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ width:34, height:34, borderRadius:10, background:`linear-gradient(135deg, ${color}33, ${color}11)`,
            border:`1px solid ${color}44`, display:"grid", placeItems:"center", fontSize:11, fontWeight:700, color }}>{initials||"?"}</div>
          <div>
            <div style={{ fontSize:13, fontWeight:700 }}>{name}</div>
            <div style={{ fontSize:10, color:"#4A5468" }}>{role||"Member"} · {budget} pts</div>
          </div>
        </div>
      )}

      {/* Actions */}
      <div style={{ display:"flex", gap:10 }}>
        <button onClick={handleSave} disabled={!name.trim()} style={{ flex:1, padding:"11px", borderRadius:11, border:"none",
          background:name.trim()?"#7C5CFF":"#1B2336", color:name.trim()?"#fff":"#4A5468",
          fontSize:12, fontWeight:700, cursor:name.trim()?"pointer":"not-allowed" }}>{initial?"Save Changes":"Add to Team"}</button>
        <button onClick={onCancel} style={{ padding:"11px 18px", borderRadius:11, border:"1px solid #1B2336",
          background:"transparent", color:"#6B7488", fontSize:12, fontWeight:600, cursor:"pointer" }}>Cancel</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
